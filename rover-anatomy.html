<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rover Anatomy Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --page-bg: #0b0e12;
    --surface: #11151b;
    --text: #e8e6e1;
    --text-muted: #9aa3ad;
    --text-subtle: #5d6670;
    --line: #1f2731;
    --grid: rgba(120, 150, 190, 0.07);
    --accent: #4f8fe0;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-fast: 120ms;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text);
    font: 400 17px/1.6 var(--sans);
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 30%, transparent 100%);
    pointer-events: none;
  }
  .label {
    font: 500 12px/1.4 var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .page { position: relative; max-width: 1280px; margin: 0 auto; padding: 40px 32px 64px; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 24px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  header b { color: var(--accent); font-weight: 500; }
  h1 { margin: 6px 0 0; font: 500 28px/1.2 var(--sans); letter-spacing: -0.01em; }

  .stage { position: relative; height: min(78vh, 760px); margin-top: 8px; }
  .stage canvas { position: absolute; inset: 0; display: block; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  #leads, #callouts { position: absolute; inset: 0; pointer-events: none; }
  #leads polyline { fill: none; stroke: var(--text-subtle); stroke-width: 1; }
  #leads circle { fill: var(--accent); }
  #leads .hot polyline { stroke: var(--accent); }
  .callout { position: absolute; width: 210px; transform: translateY(-50%); }
  .callout.left { text-align: right; }
  .callout .t { font: 500 12px/1.3 var(--mono); letter-spacing: 0.08em; color: var(--text); }
  .callout .d { font: 400 12px/1.4 var(--mono); color: var(--text-muted); }
  .callout.hot .t { color: var(--accent); }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; border-top: 1px solid var(--line); padding-top: 14px; }
  button {
    font: 500 13px/1 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 12px 18px;
    min-height: 44px;
    cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease-out);
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls label { display: flex; align-items: center; gap: 12px; }
  input[type='range'] { accent-color: var(--accent); width: 180px; }
  .hint { margin-left: auto; color: var(--text-subtle); }

  .legend { display: none; list-style: none; padding: 0; margin: 20px 0 0; }
  .legend li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); }

  @media (max-width: 760px) {
    .page { padding: 24px 16px 48px; }
    header { flex-direction: column; align-items: start; }
    .stage { height: 62vh; }
    #leads, #callouts { display: none; }
    .legend { display: block; }
    .hint { margin-left: 0; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <div class="label"><b>FIG. 01</b> — Exploded view · rocker-bogie rover</div>
        <h1>Mars Rover — Yonder Dynamics</h1>
      </div>
      <div class="label" id="meta">Loading model…</div>
    </header>

    <div class="stage" id="stage">
      <svg id="leads" aria-hidden="true"></svg>
      <div id="callouts" aria-hidden="true"></div>
      <div class="loading label" id="loading">Loading parts…</div>
    </div>

    <div class="controls">
      <button id="toggle" type="button">Disassemble</button>
      <label class="label">Assembly <input id="tRange" type="range" min="0" max="100" value="0" /></label>
      <label class="label">Spread <input id="spreadRange" type="range" min="40" max="170" value="100" /></label>
      <span class="label hint">Drag to orbit · scroll to zoom · hover a part</span>
    </div>

    <ul class="legend label" id="legend"></ul>
  </div>

  <script type="module" src="/demo/roverAnatomy.ts"></script>
</body>
</html>
